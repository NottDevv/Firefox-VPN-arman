name: Windows 7 Legacy compatibility

on:
  push:
    branches: [windows-7-legacy-x64]
    paths:
      - 'app/**'
      - 'core/**'
      - '.github/workflows/windows-7-legacy-check.yml'
  workflow_dispatch:

concurrency:
  group: windows-7-legacy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Match Throne's legacy build architecture: cross-compile the Go core on macOS
  # with MetaCubeX's patched Go 1.26 toolchain, then hand the EXEs to Windows packaging.
  build-core-legacy:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: macos-go-mod-${{ hashFiles('core/go.sum') }}
          restore-keys: |
            macos-go-mod-
      - name: Cache MetaCubeX legacy Go toolchain
        id: cache-metacubex-go
        uses: actions/cache@v4
        with:
          path: .toolchains/metacubex-go
          key: metacubex-go-1.26-${{ runner.os }}-${{ runner.arch }}
      - name: Install MetaCubeX Go 1.26 for macOS host
        if: steps.cache-metacubex-go.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          host_os="$(go env GOHOSTOS)"
          host_arch="$(go env GOHOSTARCH)"
          archive="$RUNNER_TEMP/metacubex-go.tar.gz"
          curl -fL "https://github.com/MetaCubeX/go/releases/download/build/go1.26.${host_os}-${host_arch}.tar.gz" -o "$archive"
          mkdir -p .toolchains
          tar -xzf "$archive" -C .toolchains
          mv .toolchains/go .toolchains/metacubex-go
      - name: Resolve modules and cross-build Windows 7 Core and TUN
        shell: bash
        run: |
          set -euo pipefail
          GOCMD="$GITHUB_WORKSPACE/.toolchains/metacubex-go/bin/go"
          test -x "$GOCMD"
          "$GOCMD" version
          export GOTOOLCHAIN=local
          mkdir -p legacy-core
          cd core
          "$GOCMD" mod tidy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          if ! git diff --cached --quiet; then
            git commit -m "Resolve Go dependencies for Windows 7 legacy"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 GOTOOLCHAIN=local "$GOCMD" build -trimpath -ldflags="-s -w" -o ../legacy-core/arman-vpn-core.exe ./cmd/arman-vpn-core
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 GOTOOLCHAIN=local "$GOCMD" build -tags=with_gvisor -trimpath -ldflags="-s -w" -o ../legacy-core/arman-vpn-tun.exe ./cmd/arman-vpn-tun
      - name: Upload legacy Go binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-7-legacy-core
          path: legacy-core/*.exe
          if-no-files-found: error
          retention-days: 7

  flutter-legacy:
    needs: build-core-legacy
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      # RustDesk's custom 3.24-era Windows x64 engine restores Win7 APIs in Dart/Engine.
      # Keep this engine paired with Flutter 3.24.5; the stock engine is not Win7-compatible.
      - name: Install RustDesk Windows 7 compatible Flutter engine
        shell: pwsh
        run: |
          flutter --version
          flutter precache --windows
          $flutterCommand = (Get-Command flutter).Source
          $flutterRoot = Split-Path (Split-Path $flutterCommand -Parent) -Parent
          $engineDir = Join-Path $flutterRoot "bin\cache\artifacts\engine\windows-x64-release"
          if (-not (Test-Path $engineDir)) { throw "Flutter Windows x64 release engine directory not found: $engineDir" }
          $archive = Join-Path $env:RUNNER_TEMP "rustdesk-windows-x64-release.zip"
          $extract = Join-Path $env:RUNNER_TEMP "rustdesk-windows-x64-release"
          Invoke-WebRequest -Uri "https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          if (-not (Test-Path (Join-Path $extract "flutter_windows.dll"))) { throw "RustDesk engine archive is missing flutter_windows.dll" }
          Copy-Item -Path (Join-Path $extract "*") -Destination $engineDir -Recurse -Force
          if (-not (Test-Path (Join-Path $engineDir "flutter_windows.dll"))) { throw "RustDesk Flutter engine installation failed" }
          Write-Host "Installed RustDesk patched Flutter engine into $engineDir"
          flutter doctor -v
      - name: Cache Dart pub packages
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\Pub\Cache
          key: ${{ runner.os }}-dart-pub-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-dart-pub-
      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get
      - name: Generate English and Persian localizations
        working-directory: app
        run: flutter gen-l10n
      - name: Preserve resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: windows-7-legacy-pubspec-lock
          path: app/pubspec.lock
          if-no-files-found: error
          retention-days: 7
      - name: Commit resolved Flutter lockfile
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/pubspec.lock
          $changed = git diff --cached --name-only
          if ($changed) {
            git commit -m "Update Flutter lockfile for Windows 7 legacy"
            git push origin "HEAD:$env:GITHUB_REF_NAME"
          }
      - name: Analyze
        working-directory: app
        run: flutter analyze --no-pub
      - name: Tests
        working-directory: app
        run: flutter test --no-pub
      - name: Prepare Windows 7 plugin registration
        shell: pwsh
        run: ./scripts/prepare-windows-legacy.ps1
      - name: Build Windows x64 legacy runner
        working-directory: app
        run: flutter build windows --release --no-pub --dart-define=ARMAN_WINDOWS_LEGACY=true
      - name: Download Windows 7 legacy Go binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-7-legacy-core
          path: legacy-core
      - name: Install legacy Go binaries into release folder
        shell: pwsh
        run: |
          $releaseDir = "app/build/windows/x64/runner/Release"
          $coreDir = Join-Path $releaseDir "core"
          New-Item -ItemType Directory -Path $coreDir -Force | Out-Null
          Copy-Item "legacy-core/arman-vpn-core.exe" $coreDir -Force
          Copy-Item "legacy-core/arman-vpn-tun.exe" $coreDir -Force
      - name: Package Windows 7 legacy x64 ZIP
        shell: pwsh
        run: |
          $releaseDir = "app/build/windows/x64/runner/Release"
          if (-not (Test-Path "$releaseDir/core/arman-vpn-core.exe")) { throw "Core executable was not installed in the core folder" }
          if (-not (Test-Path "$releaseDir/core/arman-vpn-tun.exe")) { throw "TUN service executable was not installed in the core folder" }
          Compress-Archive -Path "$releaseDir/*" -DestinationPath "app/build/Firefox-VPN-arman-Windows-Legacy-x64.zip" -Force
      - name: Upload Windows 7 legacy x64 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Firefox-VPN-arman-Windows-Legacy-x64
          path: app/build/Firefox-VPN-arman-Windows-Legacy-x64.zip

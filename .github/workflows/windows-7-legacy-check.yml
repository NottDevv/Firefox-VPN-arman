name: Windows 7 Legacy compatibility

on:
  push:
    branches: [windows-7-legacy-x64]
    paths:
      - 'app/**'
      - '.github/workflows/windows-7-legacy-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-legacy:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Tests
        working-directory: app
        run: flutter test

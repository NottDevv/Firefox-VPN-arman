name: Windows 7 Legacy compatibility

on:
  push:
    branches: [windows-7-legacy-x64]
    paths:
      - 'app/**'
      - '.github/workflows/windows-7-legacy-check.yml'
  workflow_dispatch:

concurrency:
  group: windows-7-legacy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter-legacy:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get
      - name: Preserve resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: windows-7-legacy-pubspec-lock
          path: app/pubspec.lock
          if-no-files-found: error
          retention-days: 7
      - name: Analyze
        working-directory: app
        run: flutter analyze --no-pub
      - name: Tests
        working-directory: app
        run: flutter test --no-pub
      - name: Prepare Windows 7 plugin registration
        shell: pwsh
        run: ./scripts/prepare-windows-legacy.ps1
      - name: Build Windows x64 legacy runner
        working-directory: app
        run: flutter build windows --release --no-pub --dart-define=ARMAN_WINDOWS_LEGACY=true

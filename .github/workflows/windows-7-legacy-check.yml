name: Windows 7 Legacy compatibility

on:
  push:
    branches: [windows-7-legacy-x64]
    paths:
      - 'app/**'
      - 'core/**'
      - '.github/workflows/windows-7-legacy-check.yml'
  workflow_dispatch:

concurrency:
  group: windows-7-legacy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  flutter-legacy:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      # RustDesk's custom 3.24-era Windows x64 engine restores Win7 APIs in Dart/Engine.
      # Keep this engine paired with Flutter 3.24.5; the stock engine is not Win7-compatible.
      - name: Install RustDesk Windows 7 compatible Flutter engine
        shell: pwsh
        run: |
          flutter --version
          flutter precache --windows
          $flutterCommand = (Get-Command flutter).Source
          $flutterRoot = Split-Path (Split-Path $flutterCommand -Parent) -Parent
          $engineDir = Join-Path $flutterRoot "bin\cache\artifacts\engine\windows-x64-release"
          if (-not (Test-Path $engineDir)) { throw "Flutter Windows x64 release engine directory not found: $engineDir" }
          $archive = Join-Path $env:RUNNER_TEMP "rustdesk-windows-x64-release.zip"
          $extract = Join-Path $env:RUNNER_TEMP "rustdesk-windows-x64-release"
          Invoke-WebRequest -Uri "https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          if (-not (Test-Path (Join-Path $extract "flutter_windows.dll"))) { throw "RustDesk engine archive is missing flutter_windows.dll" }
          Copy-Item -Path (Join-Path $extract "*") -Destination $engineDir -Recurse -Force
          if (-not (Test-Path (Join-Path $engineDir "flutter_windows.dll"))) { throw "RustDesk Flutter engine installation failed" }
          Write-Host "Installed RustDesk patched Flutter engine into $engineDir"
          flutter doctor -v
      - name: Cache Dart pub packages
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\Pub\Cache
          key: ${{ runner.os }}-dart-pub-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-dart-pub-
      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get
      - name: Generate English and Persian localizations
        working-directory: app
        run: flutter gen-l10n
      - name: Preserve resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: windows-7-legacy-pubspec-lock
          path: app/pubspec.lock
          if-no-files-found: error
          retention-days: 7
      - name: Commit resolved Flutter lockfile
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/pubspec.lock
          $changed = git diff --cached --name-only
          if ($changed) {
            git commit -m "Update Flutter lockfile for Windows 7 legacy"
            git push origin "HEAD:$env:GITHUB_REF_NAME"
          }
      - name: Analyze
        working-directory: app
        run: flutter analyze --no-pub
      - name: Tests
        working-directory: app
        run: flutter test --no-pub
      - name: Prepare Windows 7 plugin registration
        shell: pwsh
        run: ./scripts/prepare-windows-legacy.ps1
      - name: Build Windows x64 legacy runner
        working-directory: app
        run: flutter build windows --release --no-pub --dart-define=ARMAN_WINDOWS_LEGACY=true
      # Match Throne's Windows legacy toolchain: MetaCubeX Go 1.26, not stock Go 1.20.
      - name: Cache MetaCubeX Go 1.26
        id: cache-metacubex-go
        uses: actions/cache@v4
        with:
          path: .toolchains\metacubex-go
          key: metacubex-go-1.26-windows-amd64
      - name: Install MetaCubeX Go 1.26
        if: steps.cache-metacubex-go.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "go1.26.windows-amd64.zip"
          $extract = Join-Path $env:RUNNER_TEMP "metacubex-go-extract"
          Invoke-WebRequest -Uri "https://github.com/MetaCubeX/go/releases/download/build/go1.26.windows-amd64.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          New-Item -ItemType Directory -Force -Path ".toolchains" | Out-Null
          if (-not (Test-Path "$extract/go/bin/go.exe")) { throw "MetaCubeX Go archive did not contain go/bin/go.exe" }
          Move-Item -Path "$extract/go" -Destination ".toolchains/metacubex-go"
      - name: Activate patched Go toolchain
        shell: pwsh
        run: |
          $goBin = Join-Path $env:GITHUB_WORKSPACE ".toolchains\metacubex-go\bin"
          if (-not (Test-Path (Join-Path $goBin "go.exe"))) { throw "Patched Go executable is missing" }
          Add-Content -Path $env:GITHUB_PATH -Value $goBin
          Add-Content -Path $env:GITHUB_ENV -Value "GOTOOLCHAIN=local"
          $env:PATH = "$goBin;$env:PATH"
          $version = & (Join-Path $goBin "go.exe") version
          Write-Host $version
          if ($version -notmatch "go1\.26\.") { throw "Expected MetaCubeX Go 1.26, got: $version" }
      - name: Resolve Go modules with MetaCubeX Go 1.26
        working-directory: core
        run: go mod tidy
      - name: Commit resolved Go module files
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/go.mod core/go.sum
          $changed = git diff --cached --name-only
          if ($changed) {
            git commit -m "Pin Go dependencies for Windows 7 legacy"
            git push origin "HEAD:$env:GITHUB_REF_NAME"
          }
      - name: Build Windows x64 core
        working-directory: core
        run: go build -trimpath -ldflags="-s -w" -o ../app/build/windows/x64/runner/Release/arman-vpn-core.exe ./cmd/arman-vpn-core
      - name: Build Windows x64 TUN service
        working-directory: core
        run: go build -tags=with_gvisor -trimpath -ldflags="-s -w" -o ../app/build/windows/x64/runner/Release/arman-vpn-tun.exe ./cmd/arman-vpn-tun
      - name: Package Windows 7 legacy x64 ZIP
        shell: pwsh
        run: |
          $releaseDir = "app/build/windows/x64/runner/Release"
          if (-not (Test-Path "$releaseDir/arman-vpn-core.exe")) { throw "Core executable was not built" }
          if (-not (Test-Path "$releaseDir/arman-vpn-tun.exe")) { throw "TUN service executable was not built" }
          Compress-Archive -Path "$releaseDir/*" -DestinationPath "app/build/Firefox-VPN-arman-Windows-Legacy-x64.zip" -Force
      - name: Upload Windows 7 legacy x64 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Firefox-VPN-arman-Windows-Legacy-x64
          path: app/build/Firefox-VPN-arman-Windows-Legacy-x64.zip
